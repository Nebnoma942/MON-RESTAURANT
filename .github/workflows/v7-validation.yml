name: V7 technical validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      PORT: "4173"
      BASE_PATH: "/"
      SESSION_SECRET: "ci-test-secret-change-me-please-32chars"
      CORS_ORIGINS: "http://localhost:4173"
      EXPO_PUBLIC_DOMAIN: "ci.example.invalid"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build workspace
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high || true
